name: Manual GEO audit
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTP(S) URL to audit
        required: true
        default: https://example.com
      max_pages:
        description: Maximum pages (1-20)
        required: true
        default: "3"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node bin/geo.js "$TARGET_URL" --max-pages "$MAX_PAGES" --format markdown --output audit-report.md
        env:
          TARGET_URL: ${{ inputs.url }}
          MAX_PAGES: ${{ inputs.max_pages }}
      - uses: actions/upload-artifact@v4
        with:
          name: opengeo-audit-report
          path: audit-report.md
